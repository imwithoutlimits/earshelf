name: Keep Supabase awake
# Supabase pauses free projects after 7 days without activity. This sends one tiny request twice a week.
# Needs the repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (the same two used by "Load Tapestry content").
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets first."; exit 1; fi
          curl -fsS "$URL/rest/v1/translations?select=id&limit=1" -H "apikey: $KEY" | head -c 200; echo
