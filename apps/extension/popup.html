<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send to earshelf</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #262522; background: #fbfaf7; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #315f72; }
  p { margin: 0 0 12px; color: #746f66; font-size: 13px; }
  button { width: 100%; min-height: 44px; border: 0; border-radius: 999px; background: #315f72; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #c8874d; outline-offset: 2px; }
  a { color: #315f72; }
</style>
</head>
<body>
  <h1>earshelf</h1>
  <p id="msg">Send the page you are reading to your library, then listen to it anywhere.</p>
  <button id="send">Send this page</button>
  <p style="margin-top:12px"><a href="options.html" target="_blank">Settings</a></p>
  <script src="popup.js"></script>
</body>
</html>
